# Serves the Next.js static export. Traefik terminates TLS and adds the security headers, so this
# only has to find the right file and set cache policy.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Used by deploy.sh's health gate and by the Docker healthcheck.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf font/otf;
    gzip_min_length 1024;

    # Hashed build output: safe to cache forever.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # trailingSlash: true in next.config.ts means every route is <path>/index.html.
    location / {
        try_files $uri $uri/ $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
